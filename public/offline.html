<!doctype html>
<html lang="vi" data-palette="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0E1A">
<title>Mất mạng rồi · Fito</title>
<script>
try {
  var p = localStorage.getItem("fito-palette");
  if (p === "neon" || p === "keo" || p === "hoanghon") document.documentElement.dataset.palette = p;
} catch (e) {}
</script>
<style>
:root, [data-palette="neon"] { color-scheme: dark; --bg: #0D0E1A; --surface: #171829; --line: #2C2E48; --accent: #C6F432; --fg: #F4F4FA; --muted: #B3B5CF; --on-accent: #0D0E1A; }
[data-palette="keo"] { --bg: #16121F; --surface: #211A2E; --line: #3A2F4F; --accent: #FFB4A2; --muted: #C3B4CC; --on-accent: #16121F; }
[data-palette="hoanghon"] { --bg: #120F0D; --surface: #1E1915; --line: #3A3029; --accent: #FF8A3D; --muted: #C2B3A6; --on-accent: #120F0D; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
.logo { color: var(--accent); font-size: 28px; font-weight: 800; }
svg { width: 160px; max-width: 60vw; height: auto; }
h1 { margin: 0; font-size: 32px; font-weight: 800; color: var(--fg); }
p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 34ch; }
button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 800; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.note { font-size: 14px; font-style: italic; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  svg { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
}
</style>
</head>
<body>
<div class="logo">Fito</div>
<svg viewBox="0 0 120 130" role="img" aria-label="Bắp buồn">
  <g fill="#FFF4D6" stroke="#2A1D0F" stroke-width="3"><circle cx="34" cy="42" r="15"/><circle cx="86" cy="42" r="15"/><circle cx="58" cy="28" r="18"/><circle cx="46" cy="50" r="14"/><circle cx="74" cy="50" r="14"/></g>
  <path d="M22 54 h76 l-10 70 h-56z" fill="#FF5A5F"/>
  <path d="M37 55 h15 l2 68 h-11z M68 55 h15 l-6 68 h-11z" fill="#FFF4D6"/>
  <path d="M22 54 h76 l-10 70 h-56z" fill="none" stroke="#2A1D0F" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="49" cy="84" r="4.5" fill="#2A1D0F"/><circle cx="71" cy="84" r="4.5" fill="#2A1D0F"/>
  <circle cx="42" cy="93" r="4" fill="#FF9DB0"/><circle cx="78" cy="93" r="4" fill="#FF9DB0"/>
  <path d="M52 99 q8 -7 16 0" stroke="#2A1D0F" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
<h1>Mất mạng rồi</h1>
<p>Bắp không bắt được sóng. Kiểm tra wifi hoặc 4G rồi thử lại nhé.</p>
<button type="button" onclick="location.reload()">Thử lại</button>
<span class="note">Có mạng lại là Bắp tự tải lại trang.</span>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
