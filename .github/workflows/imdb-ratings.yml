name: Nạp điểm IMDb

on:
  schedule:
    - cron: "0 20 * * 0" # 3 giờ sáng thứ Hai giờ VN
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Script không có dependency nên không cần npm ci
      - run: node scripts/import-imdb-ratings.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
