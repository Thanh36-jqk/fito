name: CI

# Cổng chất lượng: chạy trên mọi PR và mỗi lần đẩy lên main.
# Mục tiêu: bắt lỗi TRƯỚC khi Vercel deploy. Build chạy KHÔNG secret để chứng minh
# `next build` không cần mạng/token (nếu lỡ có call ngoài lúc build sẽ fail ở đây, không phải ở prod).

on:
  pull_request:
  push:
    branches: [main]

# PR đẩy thêm commit thì huỷ lần chạy cũ cho đỡ tốn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # KHÔNG chạy `tsc --noEmit` riêng: app dùng route types Next tự sinh (PageProps/LayoutProps)
      # trong .next/types, chỉ có SAU build. `next build` dưới đây đã tự typecheck đầy đủ.
      - name: Build (offline — không truyền secret, đã gồm typecheck)
        # Build phải qua mà KHÔNG có TMDB_READ_TOKEN/Supabase: dữ liệu ngoài đã hoãn sang
        # request-time bằng await connection(), nên build không chạm mạng.
        # Nudge nâng cấp đã tắt bằng experimental.agentUpgrade:false nên build không bị dừng.
        run: npm run build
